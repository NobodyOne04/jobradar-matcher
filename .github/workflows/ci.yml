name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests
      - run: uv run pytest
      - name: pip-audit (runtime dependencies)
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > /tmp/req.txt
          uv run pip-audit --strict -r /tmp/req.txt

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t jobradar-matcher:ci .
      - name: smoke test
        run: |
          export MATCHER_TOKEN="$(openssl rand -hex 16)"  # throwaway, per run
          docker run -d --name m -e MATCHER_TOKEN -p 8000:8000 jobradar-matcher:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/readyz && break; sleep 1; done
          curl -fs -H "Authorization: Bearer $MATCHER_TOKEN" localhost:8000/v1/version
          docker logs m
