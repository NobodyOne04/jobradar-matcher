# Skill taxonomy (matcher ADR 0002). Part of every model version (ADR 0004).
#
# Each skill: id (stable, lowercase), name, category, aliases (matched case-insensitively on
# whole tokens, 1-4 words), optional `cased` aliases (matched only in exactly this case: for
# names that are also common words, like "Go" or "R"), optional `related` skill ids (a
# related skill the candidate has counts as transferable, with partial credit).
#
# Grow it from the "unrecognized" terms that extraction reports on real postings.

categories:
  - language
  - processing
  - orchestration
  - warehouse
  - database
  - streaming
  - cloud
  - infrastructure
  - devops
  - ml
  - bi
  - quality
  - format
  - api
  - practice

