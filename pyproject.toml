[project]
name = "jobradar-matcher"
version = "0.3.1"
description = "Matching service for jobradar: skill extraction, explainable scoring, versioned models"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "mlflow-skinny==3.18.0",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
matcher = "matcher.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "matcher"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["S104"]  # binding 0.0.0.0 is intended inside the container

[tool.ruff.lint.per-file-ignores]
# tests: asserts, fake tokens, real-world dashes and fullwidth text on purpose, and the
# lifecycle test starting an MLflow container with the docker CLI
"tests/*" = ["S101", "S105", "S106", "RUF001", "S108", "S603", "S607"]
"src/matcher/extract/*" = ["RUF001"]  # patterns match the en dashes and minus signs postings use

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnxruntime"]  # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261111",
]
